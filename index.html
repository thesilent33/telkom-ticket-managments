<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>🎟️ Ticket Manager</title>
  <meta name="description" content="Manajemen tiket gangguan internet untuk teknisi lapangan">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css?v=2.8">
</head>
<body>

<!-- ── Top Navigation (Sticky Header & Filter Bar) ──────────────── -->
<div class="sticky-nav" id="sticky-nav">

  <!-- ── Header ───────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-brand">
      <div class="app-title">
        <span>🎟️</span>
        <span class="app-title-text">Ticket Manager</span>
        <span class="realtime-dot" title="Realtime aktif"></span>
      </div>
      <div class="app-subtitle" id="ticket-summary">Memuat tiket...</div>
    </div>
    <div class="header-actions">
      <button class="btn-header-batch" id="btn-batch-mode" title="Mode pilih banyak tiket untuk ukur / hapus">
        <span>☑️</span>
        <span class="btn-label">Pilih</span>
      </button>
      <button class="btn-ukur-all-header" id="btn-ukur-all" title="Ukur semua tiket pada filter aktif">
        <span>📡</span>
        <span class="btn-label">Ukur <span class="hide-mobile">Semua </span>(<span id="ukur-all-count">0</span>)</span>
      </button>
      <div class="header-search-wrap" id="header-search-wrap" title="Cari tiket, inet, ODP, teknisi...">
        <span class="header-search-icon">🔍</span>
        <input type="search" id="input-search" class="header-input-search" placeholder="Cari..." autocomplete="off">
        <button type="button" id="btn-clear-search" class="btn-clear-search" style="display:none;" title="Bersihkan pencarian">✕</button>
      </div>
    </div>
  </header>

  <!-- ── Loading Bar ──────────────────────────────────────────────── -->
  <div id="loading-bar"></div>

  <!-- ── Group Bar (Folder / Custom Lists) ─────────────────────────── -->
  <div class="group-bar" id="group-bar" role="tablist" aria-label="Grup tiket">
    <div class="group-tabs-scroll" id="group-tabs-scroll">
      <button class="btn-group-tab active" data-group="all">
        <span>🌐</span> Semua Tiket <span class="group-count" id="count-group-all">0</span>
      </button>
      <div id="custom-group-tabs" class="custom-group-tabs">
        <!-- Rendered dynamically by JS -->
      </div>
      <button class="btn-group-add" id="btn-add-group" title="Buat grup baru">
        <span>➕</span> Buat Grup
      </button>
    </div>
  </div>

  <!-- ── Optical Status Bar (Sub-Bar Chips LOS / SPEC / UNSPEC) ─────── -->
  <div class="optical-bar" id="optical-bar" role="tablist" aria-label="Filter kondisi optik">
    <div class="optical-tabs-scroll" id="optical-tabs-scroll">
      <span class="optical-bar-label">Optik:</span>
      <button class="btn-optical-chip active" data-filter-optical="all">
        Semua <span class="optical-count" id="count-opt-all">0</span>
      </button>
      <button class="btn-optical-chip chip-los" data-filter-optical="los">
        🔴 LOS <span class="optical-count" id="count-opt-los">0</span>
      </button>
      <button class="btn-optical-chip chip-unspec" data-filter-optical="unspec">
        ⚠️ UNSPEC <span class="optical-count" id="count-opt-unspec">0</span>
      </button>
      <button class="btn-optical-chip chip-spec" data-filter-optical="spec">
        🟢 SPEC <span class="optical-count" id="count-opt-spec">0</span>
      </button>
      <button class="btn-optical-chip chip-not-found" data-filter-optical="not_found">
        ❓ Tidak Ditemukan <span class="optical-count" id="count-opt-not_found">0</span>
      </button>
      <button class="btn-optical-chip chip-unmeasured" data-filter-optical="unmeasured">
        ⚪ Belum Diukur <span class="optical-count" id="count-opt-unmeasured">0</span>
      </button>
    </div>
  </div>

  <!-- ── Filter Bar ────────────────────────────────────────────────── -->
  <div class="filter-bar" role="tablist" aria-label="Filter tiket">

    <!-- Filter Status -->
    <div class="filter-group">
      <button class="btn-filter active" data-filter-status="all">
        Semua <span class="filter-count" id="count-all">0</span>
      </button>
      <button class="btn-filter" data-filter-status="open">
        ⏳ Open <span class="filter-count" id="count-open">0</span>
      </button>
      <button class="btn-filter" data-filter-status="done">
        ✅ Selesai <span class="filter-count" id="count-done">0</span>
      </button>
      <button class="btn-filter" data-filter-status="kendala">
        ⚠️ Kendala <span class="filter-count" id="count-kendala">0</span>
      </button>
    </div>

    <div class="filter-divider"></div>

    <!-- Filter Tier -->
    <div class="filter-group">
      <button class="btn-filter" data-filter-tier="all">
        Semua Tier <span class="filter-count" id="count-tier-all">0</span>
      </button>
      <button class="btn-filter" data-filter-tier="HVC_DIAMOND">
        💎 Diamond <span class="filter-count" id="count-tier-diamond">0</span>
      </button>
      <button class="btn-filter" data-filter-tier="HVC_PLATINUM">
        ⚪ Platinum <span class="filter-count" id="count-tier-platinum">0</span>
      </button>
      <button class="btn-filter" data-filter-tier="HVC_GOLD">
        🟡 Gold <span class="filter-count" id="count-tier-gold">0</span>
      </button>
      <button class="btn-filter" data-filter-tier="INDIBIZ">
        🔵 Indibiz <span class="filter-count" id="count-tier-indibiz">0</span>
      </button>
      <button class="btn-filter" data-filter-tier="REGULER">
        ⚫ Reguler <span class="filter-count" id="count-tier-reguler">0</span>
      </button>
    </div>

    <div class="filter-divider"></div>

    <!-- Sort Dropdown -->
    <div class="filter-group" style="align-items: center;">
      <label for="select-sort" class="sort-label">Urutkan:</label>
      <select id="select-sort" class="select-sort" aria-label="Urutkan tiket">
        <option value="ttr_desc">⏱️ TTR Terlama (Jam Berjalan)</option>
        <option value="ttr_asc">⏳ TTR Terbaru</option>
        <option value="tier_desc">💎 Tier Tertinggi (Diamond ➔ Reguler)</option>
        <option value="tier_asc">⚫ Tier Terendah (Reguler ➔ Diamond)</option>
        <option value="created_desc">🕒 Baru Ditambahkan</option>
      </select>
    </div>
  </div>

</div>

<!-- ── Tickets Container ─────────────────────────────────────────── -->
<main id="tickets-container" role="main" aria-label="Daftar tiket">
  <!-- Kartu tiket di-render oleh JS -->
  <div class="empty-state">
    <div class="empty-icon">⏳</div>
    <p>Memuat tiket...</p>
  </div>
</main>

<!-- ── Floating Batch Action Bar ───────────────────────────────── -->
<div id="batch-action-bar" class="batch-action-bar" style="display:none;">
  <div class="batch-bar-left">
    <button class="btn-batch-select-all" id="btn-batch-select-all" title="Pilih semua / Batalkan semua">
      <span id="batch-select-all-icon">☑️</span>
      <span id="batch-select-all-text"><span class="hide-mobile">Pilih </span>Semua</span>
    </button>
    <span class="batch-selected-count" id="batch-selected-count">0<span class="hide-mobile"> dipilih</span></span>
  </div>
  <div class="batch-bar-right">
    <button class="btn-batch-action btn-batch-copy" id="btn-batch-copy" disabled title="Salin nomor tiket yang dipilih ke clipboard (per baris)">
      <span>📋</span> <span class="hide-mobile">Copy </span>(<span id="batch-count-copy">0</span>)
    </button>
    <button class="btn-batch-action btn-batch-group" id="btn-batch-group" disabled title="Masukkan tiket terpilih ke grup">
      <span>📁</span> <span class="hide-mobile">Grup </span>(<span id="batch-count-group">0</span>)
    </button>
    <button class="btn-batch-action btn-batch-ukur" id="btn-batch-ukur" disabled title="Ukur tiket yang dipilih">
      <span>📡</span> <span class="hide-mobile">Ukur </span>(<span id="batch-count-ukur">0</span>)
    </button>
    <button class="btn-batch-action btn-batch-delete" id="btn-batch-delete" disabled title="Hapus tiket yang dipilih">
      <span>🗑️</span> <span class="hide-mobile">Hapus </span>(<span id="batch-count-delete">0</span>)
    </button>
    <button class="btn-batch-cancel" id="btn-batch-cancel" title="Tutup mode pilih">
      ✕
    </button>
  </div>
</div>

<!-- ── Floating Actions Bar (Detail & Tambah Tiket) ─────────────── -->
<div id="floating-actions" class="floating-actions" role="toolbar" aria-label="Aksi cepat">
  <button id="btn-floating-detail" class="btn-floating btn-floating-detail" title="Ganti mode tampilan ringkas / rincian lengkap">
    <span id="icon-compact-mode">📖</span>
    <span id="label-compact-mode">Detail</span>
  </button>
  <button id="btn-floating-add" class="btn-floating btn-floating-add" data-action="add" title="Tambah tiket baru">
    <span>➕</span>
    <span>Tambah Tiket</span>
  </button>
</div>

<!-- ── Floating Back to Top Button ───────────────────────────────── -->
<button id="btn-back-to-top" class="btn-back-to-top" title="Kembali ke atas" aria-label="Kembali ke atas">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>

<!-- ── Modal ─────────────────────────────────────────────────────── -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal-box">
    <div id="modal-body">
      <!-- Diisi oleh JS -->
    </div>
    <div class="modal-footer">
      <button id="modal-cancel"  class="btn-modal-cancel">Batal</button>
      <button id="modal-confirm" class="btn-modal-confirm">OK</button>
    </div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────── -->
<!-- Di-render oleh JS saat dibutuhkan -->

<!-- ── Scripts (ES Modules) ───────────────────────────────────────── -->
<script type="module" src="js/app.js?v=2.8"></script>

<!-- ── Inline: update ticket summary header ──────────────────────── -->
<script type="module">
  // Update subtitle header dengan jumlah tiket
  const obs = new MutationObserver(() => {
    const cards = document.querySelectorAll('.ticket-card');
    const done  = document.querySelectorAll('.card-done').length;
    const all   = cards.length;
    const sub   = document.getElementById('ticket-summary');
    if (sub && all > 0) {
      sub.textContent = `${all} tiket · ${done} selesai`;
    } else if (sub) {
      sub.textContent = 'Belum ada tiket';
    }
  });
  obs.observe(document.getElementById('tickets-container'), { childList: true, subtree: true });
</script>

</body>
</html>
